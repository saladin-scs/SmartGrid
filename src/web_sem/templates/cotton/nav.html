<header class="topbar">
  <a class="brand" href="{% url 'home' %}">ENERGIE</a>
  <nav class="nav" aria-label="Modules">
    <a href="{% url 'home' %}" {% if active == "home" %}aria-current="page"{% endif %}>Home</a>
    {% for module in ontology_modules %}
      <a href="{% url module.list_url_name %}" {% if active == module.key %}aria-current="page"{% endif %}>{{ module.root }}</a>
    {% endfor %}
    <a href="{% url 'questions' %}" {% if active == "questions" %}aria-current="page"{% endif %}>Questions</a>
    <a href="{% url 'entity_creation' %}" {% if active == "creation" %}aria-current="page"{% endif %}>Créer un individu</a>
    <a href="{% url 'admin:index' %}">Admin</a>
  </nav>
</header>
