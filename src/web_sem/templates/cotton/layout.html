{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if title %}{{ title }} · {% endif %}ENERGIE</title>
  <link rel="stylesheet" href="{% static 'web_sem/site.css' %}">
</head>
<body>
  <c-nav active="{{ active }}"></c-nav>
  <main class="shell">
    {% if messages %}
      <ul class="messages">
        {% for message in messages %}
          <li class="message message-{{ message.tags }}">{{ message }}</li>
        {% endfor %}
      </ul>
    {% endif %}
    {{ slot }}
  </main>
</body>
</html>
