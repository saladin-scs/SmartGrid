services:
  fuseki:
    image: stain/jena-fuseki:5.1.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:3030:3030"
    environment:
      ADMIN_PASSWORD: ${FUSEKI_ADMIN_PASSWORD:?Set FUSEKI_ADMIN_PASSWORD in .env}
      TDB: "2"
      FUSEKI_DATASET_1: ${FUSEKI_DATASET:-energy}
    volumes:
      - fuseki-tdb2:/fuseki
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3030/$/ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

volumes:
  fuseki-tdb2: